spring.application.name=zentri-backend

spring.datasource.url=${ZENTRI_DB_URL}
spring.datasource.username=${ZENTRI_DB_USER}
spring.datasource.password=${ZENTRI_DB_PASSWORD}
spring.datasource.driver-class-name=${ZENTRI_DB_DRIVER}

jwt.secret-key=${ZENTRI_JWT_SECRET_KEY}
jwt.expiration-time=${ZENTRI_JWT_EXPIRATION_TIME}

app.front.url=${ZENTRI_FRONT_URL}
